// The misc module is the home for example / demo code (see docs/claude/architecture.md).
// It is compiled by Gradle so the examples don't rot against the library APIs, but it is
// deliberately NOT published to Maven and NOT bundled into the distribution jars - example
// code must not become part of the shipped bc* API surface. Hence no publishing block and
// no entry in the root build.gradle distModules list.

plugins {
    // Generates the gRPC service and protobuf message classes the MLS interop harness under
    // org.bouncycastle.mls.examples.client implements. The harness lives here rather than in the
    // published mls module because it is a test tool for the RFC 9420 interoperability runner,
    // not library API: shipping it in bcmls put classes needing io.grpc and com.google.protobuf
    // into a published jar whose POM and OSGi manifest declared neither.
    id 'com.google.protobuf' version '0.10.0'
}

apply plugin: 'com.google.protobuf'

// 1.83.1 clears CVE-2024-7246 (HPACK table poisoning through an HTTP/2 proxy, fixed in 1.58.3)
// and CVE-2025-55163 (the MadeYouReset HTTP/2 DDoS, fixed in 1.75.0). protobuf-java arrives
// transitively from grpc-protobuf; protocVersion below tracks it so the generated code and the
// runtime agree, and is past 3.25.5, which fixed CVE-2024-7254 (recursion on unknown fields).
def grpcVersion = '1.83.1'
def protocVersion = '3.25.9'

jar.archiveBaseName = "bcmisc-$vmrange"

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

dependencies {
    implementation project(':prov')
    implementation project(':util')
    implementation project(':pkix')
    implementation project(':pg')
    implementation project(':mail')
    implementation project(':tls')
    implementation project(':mls')

    implementation group: 'javax.mail', name: 'mail', version: '1.4.7'

    // The MLS interop harness only, and by coordinate rather than as hand-placed jars under
    // test/libs, which were invisible both to Dependabot (see the note on files()/fileTree()
    // in .github/dependabot.yml) and to any dependency scanner, so they sat three CVEs behind
    // without anything to say so. grpc-api, grpc-core, protobuf-java, guava, failureaccess,
    // perfmark and netty all arrive transitively, at versions consistent with each other.
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"

    // javax.annotation.Generated, referenced by the generated service classes
    compileOnly "org.apache.tomcat:annotations-api:6.0.53"
    compileOnly "io.grpc:grpc-services:${grpcVersion}"

    runtimeOnly "io.grpc:grpc-netty-shaded:${grpcVersion}"

    // The example smoke tests (src/test) drive the S/MIME and OpenPGP examples
    // via their main() methods; they need JUnit and the same javax.mail runtime
    // as the examples themselves. PrintTestResult is carried as a per-module
    // test copy under src/test (as every other module does).
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// Checkstyle and the example-code conventions apply to what is written by hand, not to the
// protobuf/gRPC output under build/generated.
checkstyleMain {
    source = fileTree('src/main/java')
}

extractIncludeProto {
    dependsOn(":prov:jar", ":util:jar")
}

extractIncludeTestProto {
    dependsOn(":prov:jar", ":util:jar")
}

test {
    // The S/MIME and OpenPGP example smoke tests write scratch files (id.p12,
    // *.message, *.bpg, test.txt, ...) via relative paths in the working
    // directory and read them back. Run them under build/ so this debris never
    // lands in the (git-tracked) source tree. Every file they read is one they
    // first create, so relocating the working directory is self-contained.
    workingDir = layout.buildDirectory.dir("test-work").get().asFile
    doFirst {
        workingDir.mkdirs()
    }
}
