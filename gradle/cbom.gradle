/*
 * Generates a CycloneDX 1.6 CBOM (Cryptographic Bill of Materials) for the bcprov jar:
 * the JCA service tables of BouncyCastleProvider / BouncyCastlePQCProvider are
 * introspected for everything reachable through the JCA, and the public lightweight
 * API (org.bouncycastle.crypto.**, bundled in the same jar) is swept for algorithms
 * that ship with no JCA registration at all (J-PAKE, SRP-6a, OWL, HPKE, BLS12-381,
 * the SP800-90A DRBGs, KDF1/KDF2, ...). Every asset carries a bc:api property:
 * "jca" for provider-registered algorithms, "lightweight" for algorithms reachable
 * only through the lightweight API.
 *
 * Applied from the root build.gradle:  apply from: 'gradle/cbom.gradle'
 * Run:  ./gradlew generateCbom   ->  build/reports/cbom/bcprov-<vmrange>-<version>-cyclonedx.json
 * (named for the bcprov GAV it describes, classifier per CycloneDX convention — the
 * counterpart of the bc-<vmrange>-bom-<version>-cyclonedx.json SBOM from generateSbom)
 *
 * CBOM component model per https://cyclonedx.org/capabilities/cbom/ (spec 1.6):
 * one "cryptographic-asset" component per algorithm, with cryptoProperties
 * (assetType, algorithmProperties.primitive / cryptoFunctions, oid), and a
 * "provides" dependency edge from the bcprov library component to every asset.
 */
import groovy.json.JsonOutput

// SOURCE_DATE_EPOCH (seconds) for reproducible BOM timestamps: environment override first,
// then the Source-Date-Epoch manifest attribute of the bccore sources jar (the git commit
// time, stamped by core/build.gradle), then the newest jar entry time as a last resort
// (Gradle 9 pins entry times to 1980-02-01, so the manifest attribute is the useful path).
ext.sourceDateEpochFrom = { File jarFile ->
    def sde = System.getenv('SOURCE_DATE_EPOCH')
    if (sde != null)
    {
        return sde.toLong()
    }
    def jf = new java.util.jar.JarFile(jarFile)
    try
    {
        def attr = jf.getManifest()?.getMainAttributes()?.getValue('Source-Date-Epoch')
        if (attr != null)
        {
            return attr.toLong()
        }
        long max = 0
        for (e in jf.entries())
        {
            max = Math.max(max, e.getTime())
        }
        return max.intdiv(1000L)
    }
    finally
    {
        jf.close()
    }
}

ext.cbomClassify = { String type, String alg ->
    def a = alg.toUpperCase()
    def hasAny = { List words -> words.any { a.contains(it) } }

    // returns [primitive, functions] or null to skip the service
    switch (type)
    {
        case 'Cipher':
            if (hasAny(['KEM', 'KYBER', 'MLKEM', 'ML-KEM', 'NTRU', 'BIKE', 'HQC', 'CMCE', 'MCELIECE', 'FRODO', 'SABER']))
            {
                return ['kem', ['encapsulate', 'decapsulate']]
            }
            if (hasAny(['RSA', 'ELGAMAL', 'IES', 'SM2', 'SM9']))
            {
                return ['pke', ['encrypt', 'decrypt']]
            }
            if (hasAny(['CHACHA', 'SALSA', 'RC4', 'HC128', 'HC256', 'VMPC', 'GRAIN', 'ZUC']))
            {
                return ['stream-cipher', ['encrypt', 'decrypt']]
            }
            if (hasAny(['GCM', 'CCM', 'EAX', 'OCB', 'ASCON']))
            {
                return ['ae', ['encrypt', 'decrypt', 'tag']]
            }
            return ['block-cipher', ['encrypt', 'decrypt']]
        case 'Signature':
            return ['signature', ['sign', 'verify']]
        case 'MessageDigest':
            return [hasAny(['SHAKE', 'XOF']) ? 'xof' : 'hash', ['digest']]
        case 'Mac':
            return ['mac', ['tag']]
        case 'KeyAgreement':
            return ['key-agree', ['keyderive']]
        case 'KEM':
            return ['kem', ['encapsulate', 'decapsulate']]
        case 'SecureRandom':
            return ['drbg', ['generate']]
        case 'SecretKeyFactory':
            // only the derivation-function entries; plain translation factories (e.g. "AES") are not crypto primitives
            return hasAny(['PBKDF', 'PBE', 'SCRYPT', 'HKDF', 'KDF']) ? ['kdf', ['keyderive']] : null
        case 'KeyGenerator':
        case 'KeyPairGenerator':
            // contributes a keygen function to the algorithm; primitive comes from the defining service type
            return [null, ['keygen']]
        default:
            // KeyFactory / AlgorithmParameters / CertificateFactory / KeyStore / CertPath* are plumbing, not crypto assets
            return null
    }
}

/*
 * Sweep the public lightweight API (org.bouncycastle.crypto.**) bundled in the bcprov
 * jar for algorithm assets that have no JCA registration. The inventory is derived
 * from the jar itself so it cannot drift from what ships:
 *
 *  - public concrete implementations of the core primitive interfaces become
 *    candidate assets. A class is a generic construction over another primitive —
 *    not a standalone algorithm — exactly when one of its public constructors
 *    takes a core primitive (HMac(Digest), CMac(BlockCipher), ...); those are
 *    skipped, as are classes with no public constructor at all (extension points
 *    and factory-only plumbing). Interfaces that carry getAlgorithmName()
 *    (ciphers, digests, MACs) are named by instantiating the class: through its
 *    no-arg constructor, or once per constant of a single-parameter constructor
 *    taking an enum or constants-class (the NIST LWC engines —
 *    ISAPEngine(IsapType), RomulusEngine(RomulusParameters), ... — yield one
 *    asset per named variant). Classes with neither constructor shape
 *    (CSHAKEDigest(int,N,S), ThreefishEngine(int), ...) and the remaining
 *    interfaces (signers, agreements, KDFs, KEMs, DRBGs) are named from the
 *    class name.
 *  - protocol-level constructions that define no core primitive interface
 *    (the PAKEs, HPKE, BLS12-381, the password KDFs) come from a small explicit
 *    table, guarded by the presence of their classes in the jar so a removed
 *    package cannot leave a stale asset.
 *  - package-private classes are invisible to the sweep by construction: internal
 *    engines are not API and do not become assets.
 *
 * A candidate is dropped when the JCA-derived asset set already covers it: exact
 * name match (against canonical names and Alg.Alias names, '-'/'_'/'/'/'.'-insensitive),
 * or a JCA parameterisation of the same family (KMAC covers KMAC128/KMAC256).
 * Survivors are exactly the algorithms reachable only through the lightweight API,
 * and are tagged bc:api=lightweight with their defining classes in bc:classes.
 */
ext.sweepLightweightApi = { File jarFile, URLClassLoader loader, TreeMap assets, Set jcaAliasNames ->
    def cryptoPrefix = 'org/bouncycastle/crypto/'
    // mode / padding / encoding wrappers, plumbing and parameter classes are not algorithm assets
    def excludedSubpackages = ['modes/', 'paddings/', 'encodings/', 'io/', 'params/', 'util/', 'constraints/']
    // interface -> [primitive, functions, namedViaGetAlgorithmName]; ordered, first match wins
    def primitiveInterfaces = [
        [loader.loadClass('org.bouncycastle.crypto.modes.AEADCipher'), 'ae', ['decrypt', 'encrypt', 'tag'], true],
        [loader.loadClass('org.bouncycastle.crypto.Xof'), 'xof', ['digest'], true],
        [loader.loadClass('org.bouncycastle.crypto.Digest'), 'hash', ['digest'], true],
        [loader.loadClass('org.bouncycastle.crypto.StreamCipher'), 'stream-cipher', ['decrypt', 'encrypt'], true],
        [loader.loadClass('org.bouncycastle.crypto.BlockCipher'), 'block-cipher', ['decrypt', 'encrypt'], true],
        [loader.loadClass('org.bouncycastle.crypto.Mac'), 'mac', ['tag'], true],
        [loader.loadClass('org.bouncycastle.crypto.Signer'), 'signature', ['sign', 'verify'], false],
        [loader.loadClass('org.bouncycastle.crypto.DSA'), 'signature', ['sign', 'verify'], false],
        [loader.loadClass('org.bouncycastle.crypto.BasicAgreement'), 'key-agree', ['keyderive'], false],
        [loader.loadClass('org.bouncycastle.crypto.RawAgreement'), 'key-agree', ['keyderive'], false],
        [loader.loadClass('org.bouncycastle.crypto.DerivationFunction'), 'kdf', ['keyderive'], false],
        [loader.loadClass('org.bouncycastle.crypto.EncapsulatedSecretGenerator'), 'kem', ['decapsulate', 'encapsulate'], false],
        [loader.loadClass('org.bouncycastle.crypto.AsymmetricBlockCipher'), 'pke', ['decrypt', 'encrypt'], false],
        [loader.loadClass('org.bouncycastle.crypto.prng.drbg.SP80090DRBG'), 'drbg', ['generate'], false],
        [loader.loadClass('org.bouncycastle.crypto.Committer'), 'other', ['other'], false]
    ]
    // protocol-level constructions with no core primitive interface, guarded by jar presence
    def protocolAssets = [
        ['org/bouncycastle/crypto/agreement/jpake/', 'J-PAKE', 'key-agree', ['keyderive']],
        ['org/bouncycastle/crypto/agreement/ecjpake/', 'EC J-PAKE', 'key-agree', ['keyderive']],
        ['org/bouncycastle/crypto/agreement/srp/', 'SRP-6a', 'key-agree', ['keyderive']],
        ['org/bouncycastle/crypto/agreement/owl/', 'OWL', 'key-agree', ['keyderive']],
        ['org/bouncycastle/crypto/agreement/SM2KeyExchange', 'SM2 Key Exchange', 'key-agree', ['keyderive']],
        ['org/bouncycastle/crypto/hpke/', 'HPKE', 'pke', ['decapsulate', 'decrypt', 'encapsulate', 'encrypt']],
        ['org/bouncycastle/crypto/bls/', 'BLS12-381', 'signature', ['sign', 'verify']],
        ['org/bouncycastle/crypto/generators/Argon2BytesGenerator', 'Argon2', 'kdf', ['keyderive']],
        ['org/bouncycastle/crypto/generators/BCrypt', 'bcrypt', 'kdf', ['keyderive']],
        ['org/bouncycastle/crypto/generators/SCrypt', 'scrypt', 'kdf', ['keyderive']]
    ]
    // wrapper / transform classes that pass the interface test but are not standalone
    // algorithms — NullEngine / NullDigest are identity plumbing, RSABlindingEngine is a
    // transform, GenericSigner / BasicRawAgreement / BaseKDFBytesGenerator are generic
    // constructions, and Zuc128Mac is the JCA Mac.ZUC-128 under a name the
    // normalisation cannot bridge
    def skipClasses = ['NullEngine', 'NullDigest', 'RSABlindingEngine', 'GenericSigner',
                       'BasicRawAgreement', 'BaseKDFBytesGenerator', 'Zuc128Mac'] as Set
    // class-name-derived names that would otherwise be wrong or unrecognisable
    def renames = [
        'RSABlinded': 'RSA',
        'PSS': 'RSASSA-PSS',
        'X931': 'X9.31',
        'ISO9796d2': 'ISO 9796-2',
        'ISO9796d2PSS': 'ISO 9796-2 PSS',
        'BLS': 'BLS12-381',
        'RSAKEM': 'RSA-KEM',
        'ECIESKEM': 'ECIES-KEM',
        'SAKKEKEMS': 'SAKKE',
        'CMCEKEM': 'CMCE',
        'HashSP800': 'SP800-90A Hash DRBG',
        'HMacSP800': 'SP800-90A HMAC DRBG',
        'CTRSP800': 'SP800-90A CTR DRBG',
        'DualECSP800': 'SP800-90A Dual EC DRBG',
        'Hash': 'Hash Commitment',
        'GeneralHash': 'Hash Commitment',
        'SHA512t': 'SHA-512/t'
    ]
    def nameSuffixes = ['BasicAgreement', 'RawAgreement', 'StagedAgreement', 'UnifiedAgreement', 'Agreement',
                        'BytesGenerator', 'SecretGenerator', 'Generator', 'DigestSigner', 'Signer', 'Engine',
                        'DRBG', 'Committer', 'Digest', 'Mac']

    def entries = []
    def jf = new java.util.jar.JarFile(jarFile)
    try
    {
        for (e in jf.entries())
        {
            def n = e.getName()
            if (n.startsWith(cryptoPrefix) && n.endsWith('.class'))
            {
                entries << n
            }
        }
    }
    finally
    {
        jf.close()
    }
    entries.sort()

    // name (normalised) cover set from the JCA-derived assets and their aliases
    def norm = { String s -> s.toUpperCase().replaceAll(/[-_\/. ]/, '') }
    def jcaNames = new HashSet<String>()
    assets.keySet().each { jcaNames << norm(it) }
    jcaAliasNames.each { jcaNames << norm(it) }
    def coveredByJca = { String name ->
        def n = norm(name)
        if (jcaNames.contains(n))
        {
            return true
        }
        // a JCA parameterisation of the family: KMAC covers KMAC128, KMAC256, ...
        jcaNames.any { it.startsWith(n) && it.length() > n.length() && Character.isDigit(it.charAt(n.length())) }
    }

    def addAsset = { String name, String primitive, List functions, String cls ->
        if (coveredByJca(name))
        {
            return
        }
        def asset = assets.computeIfAbsent(name, {
            [name: name, primitive: primitive,
             functions: new TreeSet(), oids: new TreeSet(), serviceTypes: new TreeSet(), providers: new TreeSet(), classes: new TreeSet()]
        })
        asset.functions.addAll(functions)
        asset.classes << cls
    }

    entries.each { entry ->
        def rel = entry.substring(cryptoPrefix.length())
        if (entry.contains('$') || excludedSubpackages.any { rel.startsWith(it) })
        {
            return
        }
        def cn = entry.substring(0, entry.length() - 6).replace('/', '.')
        def cls
        try
        {
            cls = Class.forName(cn, false, loader)
        }
        catch (Throwable t)
        {
            return
        }
        def mods = cls.getModifiers()
        if (!java.lang.reflect.Modifier.isPublic(mods) || java.lang.reflect.Modifier.isAbstract(mods)
            || cls.isInterface() || cls.isEnum() || skipClasses.contains(cls.getSimpleName()))
        {
            return
        }
        def match = primitiveInterfaces.find { it[0].isAssignableFrom(cls) }
        if (match == null)
        {
            return
        }
        // no public constructor at all (Prehash, the Zuc*CoreEngine extension points):
        // not directly constructible, so not an algorithm entry point in its own right
        def ctors = cls.getConstructors()
        if (ctors.length == 0)
        {
            return
        }
        def classDerivedName = {
            def n = cls.getSimpleName()
            for (s in nameSuffixes)
            {
                if (n.endsWith(s) && n.length() > s.length())
                {
                    n = n.substring(0, n.length() - s.length())
                    break
                }
            }
            renames.getOrDefault(n, n)
        }
        def names = new LinkedHashSet()
        if (match[3])
        {
            def noArg = ctors.find { it.getParameterTypes().length == 0 }
            if (noArg == null)
            {
                // no no-arg constructor. A public constructor taking another core primitive
                // marks a generic construction (HMac(Digest), CMac(BlockCipher), ...) — not a
                // standalone algorithm. Own-type parameters are copy constructors
                // (SHA256Digest(SHA256Digest), CSHAKEDigest(CSHAKEDigest)) and don't count.
                if (ctors.any { c -> c.getParameterTypes().any { p -> p != cls && primitiveInterfaces.any { it[0].isAssignableFrom(p) } } })
                {
                    return
                }
            }
            try
            {
                if (noArg != null)
                {
                    names << (String) match[0].getMethod('getAlgorithmName').invoke(noArg.newInstance())
                }
                else
                {
                    // standalone algorithm parameterised by an enum or a constants-class —
                    // the NIST LWC engines (ISAPEngine(IsapType), RomulusEngine(RomulusParameters), ...):
                    // one asset per named variant, enumerated from the parameter type's public
                    // static fields of its own type (enum constants are exactly that shape too)
                    def variantsOf = { Class p ->
                        p.getFields().findAll { java.lang.reflect.Modifier.isStatic(it.getModifiers()) && it.getType() == p }
                    }
                    def paramCtor = ctors.find { it.getParameterTypes().length == 1 && !variantsOf(it.getParameterTypes()[0]).isEmpty() }
                    if (paramCtor != null)
                    {
                        for (v in variantsOf(paramCtor.getParameterTypes()[0]))
                        {
                            names << (String) match[0].getMethod('getAlgorithmName').invoke(paramCtor.newInstance(v.get(null)))
                        }
                    }
                }
            }
            catch (Throwable t)
            {
                return
            }
            if (names.isEmpty())
            {
                // standalone but not reflectively instantiable (CSHAKEDigest(int, N, S),
                // ThreefishEngine(int), ...): name from the class
                names << classDerivedName()
            }
        }
        else
        {
            names << classDerivedName()
        }
        names.each { addAsset((String) it, match[1], match[2], cn) }
    }

    protocolAssets.each { pa ->
        if (entries.any { it.startsWith(pa[0]) })
        {
            addAsset(pa[1], pa[2], pa[3], pa[0].replace('/', '.').with { it.endsWith('.') ? it.substring(0, it.length() - 1) + '.*' : it })
        }
    }
}

/*
 * Security category and classical strength of every post-quantum parameter set, as the library
 * itself reports them through org.bouncycastle.crypto.params.PQCParameters: every public static
 * field of parameter-set type on the listed classes is read, and its name - or, for the
 * families whose JCA service names carry a prefix, each of the given prefixes plus its name -
 * is keyed in normalised form (upper case, separators removed) so it matches the CBOM asset
 * name of the JCA service or lightweight class. Returns a map
 * normalisedName -> [name: parameterSetIdentifier, category: int, classical: int].
 */
def collectPqcSecurity(ClassLoader loader)
{
    def result = [:]
    def norm = { String n -> n.toUpperCase().replaceAll(/[-_\/. ]/, '') }
    // [class name, [prefixes the JCA names carry]]
    def sources = [
        ['org.bouncycastle.crypto.params.MLKEMParameters', ['']],
        ['org.bouncycastle.crypto.params.MLDSAParameters', ['']],
        ['org.bouncycastle.crypto.params.SLHDSAParameters', ['SLH-DSA-']],
        ['org.bouncycastle.pqc.crypto.falcon.FalconParameters', ['']],
        ['org.bouncycastle.pqc.crypto.hqc.HQCParameters', ['']],
    ]
    sources.each { src ->
        def cls
        try
        {
            cls = Class.forName(src[0], true, loader)
        }
        catch (Throwable t)
        {
            return
        }
        cls.getFields().each { f ->
            if (!java.lang.reflect.Modifier.isStatic(f.getModifiers()) || !cls.isAssignableFrom(f.getType()))
            {
                return
            }
            def p = f.get(null)
            def name = cls.getMethod('getName').invoke(p)
            def category = cls.getMethod('getSecurityCategory').invoke(p)
            def classical = cls.getMethod('getClassicalSecurityStrength').invoke(p)
            src[1].each { prefix ->
                def full = prefix + name
                result[norm(full)] = [name: full.toUpperCase(), category: category, classical: classical]
            }
        }
    }
    // XMSS and XMSS^MT are registered per tree digest (XMSS-SHA256, XMSSMT-SHAKE128, ...) with the
    // height left to the key, and the category and strength depend on the digest alone, so read
    // them off a representative parameter set for each RFC 8391 digest
    try
    {
        def oidCls = Class.forName('org.bouncycastle.asn1.ASN1ObjectIdentifier', true, loader)
        def xmssCls = Class.forName('org.bouncycastle.crypto.params.XMSSParameters', true, loader)
        def xmssCtor = xmssCls.getConstructor(int, oidCls)
        [SHA256: '2.16.840.1.101.3.4.2.1', SHA512: '2.16.840.1.101.3.4.2.3',
         SHAKE128: '2.16.840.1.101.3.4.2.11', SHAKE256: '2.16.840.1.101.3.4.2.12'].each { digest, oid ->
            def p = xmssCtor.newInstance(10, oidCls.getConstructor(String).newInstance(oid))
            def category = xmssCls.getMethod('getSecurityCategory').invoke(p)
            def classical = xmssCls.getMethod('getClassicalSecurityStrength').invoke(p)
            ['XMSS-', 'XMSSMT-'].each { prefix ->
                result[norm(prefix + digest)] = [name: prefix + digest, category: category, classical: classical]
            }
        }
    }
    catch (ClassNotFoundException e)
    {
        // older jar without the XMSS parameter classes in crypto.params
    }
    return result
}

/*
 * The CycloneDX 1.6 security-level fields for one CBOM asset, or null if the asset name does not
 * fix them. Returns [name: parameterSetIdentifier or null, category: nistQuantumSecurityLevel,
 * classical: classicalSecurityLevel or null].
 *
 * - Post-quantum parameter sets come from collectPqcSecurity, by name or, for the
 *   "...-EXTERNAL-HASH" and "<digest>WITHXMSS-<digest>" signature names, by the parameter set
 *   or XMSS variant they name.
 * - The composite and hybrid algorithms (MLDSA44-ECDSA-P256-SHA256, MLKEM768-X25519-SHA3-256,
 *   X-WING, ...) remain secure while their ML-DSA or ML-KEM component does, so they report that
 *   component's parameter set, category and strength.
 * - The quantum-vulnerable public-key algorithms NIST IR 8547 deprecates after 2030 and
 *   disallows after 2035 (RSA, DSA, DH/MQV, the EC schemes, EdDSA, X25519/X448, ElGamal, SM2,
 *   GOST R 34.10, DSTU 4145, the pairing-based SM9, SAKKE and BLS12-381, and the PAKEs built on
 *   discrete logarithms) report category 0 - "none of the categories are met" - and a classical
 *   strength only where the name fixes the curve: 128 bits for 25519 and the 256-bit GOST curves, 224 for
 *   448 (half the field size, as ConstraintUtils.bitsOfSecurityFor(ECCurve) has it) and 256 for
 *   the 512-bit GOST curves. RSA, DSA, DH and the named-curve-free EC schemes take their strength
 *   from the key, so it is left out rather than guessed.
 *
 * Names are matched so that an unrecognised algorithm gets no fields at all, never a wrong 0.
 */
ext.cbomSecurityFor = { String assetName, Map pqcSecurity ->
    def norm = { String n -> n.toUpperCase().replaceAll(/[-_\/. ]/, '') }
    def n = assetName.toUpperCase()

    def pqc = pqcSecurity[norm(n)]
    if (pqc != null)
    {
        return pqc
    }
    if (n.endsWith('-EXTERNAL-HASH'))
    {
        // ML-DSA-44-WITH-SHA512-EXTERNAL-HASH: the pre-hash parameter set, with the digest supplied
        pqc = pqcSecurity[norm(n.substring(0, n.length() - '-EXTERNAL-HASH'.length()))]
        if (pqc != null)
        {
            return pqc
        }
    }
    def xmss = (n =~ /WITH(XMSS(?:MT)?-[A-Z0-9]+)$/)
    if (xmss.find())
    {
        return pqcSecurity[norm(xmss.group(1))]
    }

    def hybrid = (n =~ /^(MLDSA(?:44|65|87)|MLKEM(?:512|768|1024))-/)
    if (hybrid.find())
    {
        return pqcSecurity[hybrid.group(1)]
    }
    if (n == 'X-WING')
    {
        return pqcSecurity['MLKEM768']
    }

    // an optional "<digest>WITH" prefix, the scheme, then the end of the name or a separator
    // introducing a mode, padding, KDF or format suffix
    def quantumVulnerable = /^(?:[A-Z0-9()-]+WITH)?(?:RSA|RAWRSASSA-PSS|RSASSA-PSS|RSAPSS|RSA-KEM|RSA-KTS-KEM-KWS|X9\.31|ISO 9796-2(?: PSS)?|DSA|DDSA|DETDSA|DH|DHU|DHIES|IES|XIES|MQV|ELGAMAL|EC|ECDSA|ECDDSA|PLAIN-ECDSA|CVC-ECDSA|ECNR|ECDH|ECDHC|ECCDH|ECCDHU|ECMQV|ECKAEG|ECIES|ECIES-KEM|ETSIKEM|ECGOST3410|ECGOST3410-2012|ECGOST3410-2012-256|ECGOST3410-2012-512|ECCSI|GOST3410|DSTU4145|DSTU4145LE|SM2|SM2 KEY EXCHANGE|SM9|SM9-SIGN|SM9-ENC|SM9-KEM|SAKKE|BLS12-381|BIP340|EDDSA|ED25519|ED25519CTX|ED25519PH|ED448|ED448PH|XDH|X25519|X25519U|X448|X448U|NACCACHESTERN|J-PAKE|EC J-PAKE|OWL|SRP-6A)(?:$|[\/(]|WITH|AND|KEK|INP1363FORMAT).*/
    if (!(n ==~ quantumVulnerable))
    {
        return null
    }
    def classical = null
    if (n =~ /(?:^|WITH)(?:ED25519|X25519)/ || n =~ /ECGOST3410-2012-256/)
    {
        classical = 128
    }
    else if (n =~ /(?:^|WITH)(?:ED448|X448)/)
    {
        classical = 224
    }
    else if (n =~ /ECGOST3410-2012-512/)
    {
        classical = 256
    }
    return [name: null, category: 0, classical: classical]
}

/*
 * The CycloneDX 1.6 schema's constraints on the three security-level fields (bom-1.6.schema.json,
 * cryptoProperties.algorithmProperties): parameterSetIdentifier a string, classicalSecurityLevel
 * an integer >= 0, nistQuantumSecurityLevel an integer from 0 to 6. Returns the violations found
 * in the assets of the passed BOM map, so generateCbom can refuse to write a BOM that would not
 * validate.
 */
ext.cbomSecurityFieldErrors = { Map bom ->
    def errors = []
    bom.components.each { c ->
        def ap = c.cryptoProperties?.algorithmProperties
        if (ap == null)
        {
            return
        }
        if (ap.containsKey('parameterSetIdentifier') && !(ap.parameterSetIdentifier instanceof String))
        {
            errors << "${c.name}: parameterSetIdentifier is not a string"
        }
        if (ap.containsKey('classicalSecurityLevel')
            && !(ap.classicalSecurityLevel instanceof Integer && ap.classicalSecurityLevel >= 0))
        {
            errors << "${c.name}: classicalSecurityLevel ${ap.classicalSecurityLevel} is not an integer >= 0"
        }
        if (ap.containsKey('nistQuantumSecurityLevel')
            && !(ap.nistQuantumSecurityLevel instanceof Integer
                 && ap.nistQuantumSecurityLevel >= 0 && ap.nistQuantumSecurityLevel <= 6))
        {
            errors << "${c.name}: nistQuantumSecurityLevel ${ap.nistQuantumSecurityLevel} is not an integer from 0 to 6"
        }
    }
    return errors
}

tasks.register('generateCbom') {
    group = 'reporting'
    description = 'Generates a CycloneDX 1.6 CBOM for the BC provider algorithms and lightweight API'
    dependsOn ':prov:jar', ':core:sourcesJar'

    def provJar = project(':prov').tasks.named('jar')
    def coreSourcesJar = project(':core').tasks.named('sourcesJar')
    def outDir = layout.buildDirectory.dir('reports/cbom')
    inputs.file(provJar.map { it.archiveFile })
    inputs.file(coreSourcesJar.map { it.archiveFile })
    outputs.dir(outDir)

    doLast {
        def jarFile = provJar.get().archiveFile.get().asFile
        def loader = new URLClassLoader([jarFile.toURI().toURL()] as URL[], (ClassLoader) null)
        // algName -> [primitive:, functions: Set, oids: Set, serviceTypes: Set, providers: Set, classes: Set]
        def assets = new TreeMap<String, Map>(String.CASE_INSENSITIVE_ORDER)
        def providerComponents = []
        // every friendly-name Alg.Alias target, for deduplicating the lightweight sweep
        // against JCA algorithms whose canonical name differs (e.g. RC4Engine vs "ARC4")
        def jcaAliasNames = new HashSet<String>()
        // normalised parameter-set name -> [name:, category:, classical:]
        def pqcSecurity = [:]

        try
        {
            ['org.bouncycastle.jce.provider.BouncyCastleProvider',
             'org.bouncycastle.pqc.jcajce.provider.BouncyCastlePQCProvider'].each { cn ->
                def prov = loader.loadClass(cn).getDeclaredConstructor().newInstance()
                providerComponents << [name: prov.getName(), info: prov.getInfo()]

                prov.getServices().each { svc ->
                    def cls = cbomClassify(svc.getType(), svc.getAlgorithm())
                    if (cls == null)
                    {
                        return
                    }
                    // normalise "OID.1.2.3"-style registrations onto the bare OID
                    def algName = svc.getAlgorithm().startsWith('OID.') ? svc.getAlgorithm().substring(4) : svc.getAlgorithm()
                    def asset = assets.computeIfAbsent(algName, {
                        [name: algName, primitive: null,
                         functions: new TreeSet(), oids: new TreeSet(), serviceTypes: new TreeSet(), providers: new TreeSet(), classes: new TreeSet()]
                    })
                    if (asset.primitive == null && cls[0] != null)
                    {
                        asset.primitive = cls[0]
                    }
                    asset.functions.addAll(cls[1])
                    asset.serviceTypes << svc.getType()
                    asset.providers << prov.getName()
                    if (algName ==~ /\d+(\.\d+)+/)
                    {
                        // service registered directly under its OID (no separate friendly-name alias)
                        asset.oids << algName
                    }
                }

                // OIDs come from the Alg.Alias.<Type>.[OID.]<oid> property entries
                prov.keySet().each { k ->
                    def m = (k =~ /^Alg\.Alias\.[A-Za-z]+\.(?:OID\.)?(\d+(?:\.\d+)+)$/)
                    if (m.matches())
                    {
                        assets.get((String) prov.get(k))?.oids?.add(m.group(1))
                    }
                    else
                    {
                        def ma = (k =~ /^Alg\.Alias\.[A-Za-z]+\.(.+)$/)
                        if (ma.matches())
                        {
                            jcaAliasNames << ma.group(1)
                        }
                    }
                }
            }

            sweepLightweightApi(jarFile, loader, assets, jcaAliasNames)

            pqcSecurity = collectPqcSecurity(loader)
        }
        finally
        {
            loader.close()
        }

        // OID-only registrations: KeyGenerator services registered directly under the OID
        // with no friendly-name Cipher/Mac sibling, so cbomClassify never sees a primitive
        // for them. Classified from the defining arc — GMObjectIdentifiers (SM4),
        // KISAObjectIdentifiers (SEED wrap, RFC 4010), NSRIObjectIdentifiers (ARIA),
        // UAObjectIdentifiers (DSTU7624), and the legacy "wrong AES" OIDs AES.Mappings
        // preserves for backwards compatibility.
        def oidOnlyPrimitives = [
            '1.2.156.10197.1.104.8': 'ae',                // sms4_gcm
            '1.2.156.10197.1.104.9': 'ae',                // sms4_ccm
            '1.2.410.200004.7.1.1.1': 'block-cipher',     // id-npki-app-cmsSeed-wrap
            '1.2.410.200046.1.1.34': 'ae',                // id_aria128_gcm
            '1.2.410.200046.1.1.35': 'ae',                // id_aria192_gcm
            '1.2.410.200046.1.1.36': 'ae',                // id_aria256_gcm
            '1.2.410.200046.1.1.37': 'ae',                // id_aria128_ccm
            '1.2.410.200046.1.1.38': 'ae',                // id_aria192_ccm
            '1.2.410.200046.1.1.39': 'ae',                // id_aria256_ccm
            '1.2.410.200046.1.1.40': 'block-cipher',      // id_aria128_kw
            '1.2.410.200046.1.1.41': 'block-cipher',      // id_aria192_kw
            '1.2.410.200046.1.1.42': 'block-cipher',      // id_aria256_kw
            '1.2.410.200046.1.1.43': 'block-cipher',      // id_aria128_kwp
            '1.2.410.200046.1.1.44': 'block-cipher',      // id_aria192_kwp
            '1.2.410.200046.1.1.45': 'block-cipher',      // id_aria256_kwp
            '1.2.804.2.1.1.1.1.1.3.7.1': 'mac',           // dstu7624gmac_128
            '1.2.804.2.1.1.1.1.1.3.7.2': 'mac',           // dstu7624gmac_256
            '1.2.804.2.1.1.1.1.1.3.7.3': 'mac',           // dstu7624gmac_512
            '1.2.804.2.1.1.1.1.1.3.10.1': 'block-cipher', // dstu7624kw_128
            '1.2.804.2.1.1.1.1.1.3.10.2': 'block-cipher', // dstu7624kw_256
            '1.2.804.2.1.1.1.1.1.3.10.3': 'block-cipher', // dstu7624kw_512
            '2.16.840.1.101.3.4.2': 'block-cipher',       // legacy wrong AES-128 OID
            '2.16.840.1.101.3.4.22': 'block-cipher',      // legacy wrong AES-192 OID
            '2.16.840.1.101.3.4.42': 'block-cipher'       // legacy wrong AES-256 OID
        ]

        // parameter-set names that only surface as KeyGenerator / KeyPairGenerator services
        // (the Signature / Cipher service lives under the family name) — infer from the name
        def fallbackPrimitive = { String name ->
            def oidPrim = oidOnlyPrimitives[name]
            if (oidPrim != null)
            {
                return oidPrim
            }
            def a = name.toUpperCase()
            if (a =~ /MLKEM\d+-/)
            {
                return 'combiner'   // ML-KEM + ECDH/X25519/RSA hybrid KEMs
            }
            if (['SPHINCS', 'DSA', 'GOST3410', 'XMSS', 'LMS', 'FALCON', 'DILITHIUM'].any { a.contains(it) })
            {
                return 'signature'
            }
            if (a.contains('KEM'))
            {
                return 'kem'
            }
            if (a.contains('SIPHASH'))
            {
                return 'mac'
            }
            if (a == 'EC')
            {
                // generic EC keypairs — the consuming ECDSA / ECDH / ECIES services all
                // register their own assets under their own names
                return 'key-agree'
            }
            if (a == 'SM9-SIGN')
            {
                // SM9 (GM/T 0044) identity-based crypto: the SM9-SIGN master keypair serves
                // Signature.SM9 (Part 2), which registers its own asset
                return 'signature'
            }
            if (a.startsWith('SM9'))
            {
                // the SM9-ENC master keypair serves the SM9-KEM encapsulation and the Cipher.SM9
                // encryption (Part 4), each of which registers its own asset
                return 'kem'
            }
            return 'unknown'
        }

        def libRef = "pkg:maven/org.bouncycastle/${jarFile.name.replaceAll(/-\d.*/, '')}@${project(':prov').version}"
        def components = assets.values().collect { a ->
            // bc:api records how the asset is reachable: through the JCA providers, or only
            // through the public lightweight API (org.bouncycastle.crypto.**) in the same jar
            def props = [[name: 'bc:api', value: a.providers.isEmpty() ? 'lightweight' : 'jca']]
            if (!a.serviceTypes.isEmpty())
            {
                props << [name: 'bc:jcaServiceTypes', value: a.serviceTypes.join(',')]
            }
            if (!a.providers.isEmpty())
            {
                props << [name: 'bc:providers', value: a.providers.join(',')]
            }
            if (!a.classes.isEmpty())
            {
                props << [name: 'bc:classes', value: a.classes.join(',')]
            }
            if (a.oids.size() > 1)
            {
                props << [name: 'bc:additionalOids', value: a.oids.tail().join(',')]
            }
            def cryptoProps = [
                assetType: 'algorithm',
                algorithmProperties: [
                    primitive: a.primitive ?: fallbackPrimitive(a.name),
                    executionEnvironment: 'software-plain-ram',
                    implementationPlatform: 'generic',
                    certificationLevel: ['none'],
                    cryptoFunctions: a.functions as List
                ]
            ]
            // CycloneDX 1.6 parameterSetIdentifier / classicalSecurityLevel / nistQuantumSecurityLevel:
            // post-quantum and hybrid assets from the library's own PQCParameters implementations
            // (NIST IR 8547 Tables 3 and 5), quantum-vulnerable ones as category 0 (see cbomSecurityFor)
            def sec = cbomSecurityFor(a.name, pqcSecurity)
            if (sec != null)
            {
                if (sec.name != null)
                {
                    cryptoProps.algorithmProperties.parameterSetIdentifier = sec.name
                }
                if (sec.classical != null)
                {
                    cryptoProps.algorithmProperties.classicalSecurityLevel = sec.classical
                }
                cryptoProps.algorithmProperties.nistQuantumSecurityLevel = sec.category
            }
            if (!a.oids.isEmpty())
            {
                cryptoProps.oid = a.oids.first()
            }
            [type: 'cryptographic-asset',
             'bom-ref': "crypto/algorithm/${a.name.toLowerCase().replaceAll(/[^a-z0-9.-]/, '-')}@BC",
             name: a.name,
             cryptoProperties: cryptoProps,
             properties: props]
        }

        // reproducible per version: name-based (type 3) UUID over the purl, and a timestamp
        // from sourceDateEpochFrom (env override -> bccore sources-jar manifest, i.e. the
        // git commit time), so the same version always yields a byte-identical CBOM
        def epoch = sourceDateEpochFrom(coreSourcesJar.get().archiveFile.get().asFile)
        def bom = [
            bomFormat: 'CycloneDX',
            specVersion: '1.6',
            serialNumber: "urn:uuid:${UUID.nameUUIDFromBytes(libRef.getBytes('UTF-8'))}".toString(),
            version: 1,
            metadata: [
                timestamp: new Date(epoch * 1000L).format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC')),
                component: [
                    type: 'library',
                    'bom-ref': libRef,
                    group: 'org.bouncycastle',
                    name: jarFile.name.replaceAll(/-\d.*/, ''),
                    version: project(':prov').version.toString(),
                    description: providerComponents.collect { it.info }.join('; '),
                    purl: libRef
                ]
            ],
            components: components,
            dependencies: [[ref: libRef, provides: components.collect { it['bom-ref'] }]]
        ]

        def fieldErrors = cbomSecurityFieldErrors(bom)
        if (!fieldErrors.isEmpty())
        {
            throw new GradleException("CBOM security-level fields violate the CycloneDX 1.6 schema:\n  " + fieldErrors.join('\n  '))
        }

        def out = new File(outDir.get().asFile, "${jarFile.name.replaceAll(/-\d.*/, '')}-${project(':prov').version}-cyclonedx.json")
        out.parentFile.mkdirs()
        out.text = JsonOutput.prettyPrint(JsonOutput.toJson(bom))
        println "CBOM written to ${out} (${components.size()} cryptographic assets)"
    }
}
