def String deriveOSGIVersion(String prjVersion) {
    if (prjVersion.contains("-SNAPSHOT")) {
        // Snapshots always extend to fourth level and terminate with time in seconds since epoch.
        prjVersion = prjVersion.replace("-SNAPSHOT", "");
        while (prjVersion.count(".") < 2) {
            prjVersion = prjVersion + ".0";
        }
        prjVersion = prjVersion + "." + System.currentTimeMillis().intdiv(1000L).intdiv(60).intdiv(60).intdiv(24);
    }
    return prjVersion
}

ext {
    bundle_version = deriveOSGIVersion(version.toString());

    // Number of parallel test forks: half the available processors (at least 1). Each test JVM is
    // heavy (it re-runs the FIPS power-on self-tests on startup) and reserves a sizable heap, so
    // half-the-cores leaves headroom for per-fork memory and the gradle daemon / OS. Shared here
    // so every module's test tasks compute the same value.
    calcTestForks = { -> Math.max(1, Runtime.getRuntime().availableProcessors().intdiv(2)) }
}

