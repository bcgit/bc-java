ext {
    // A debug build (-Prelease.debug=true, or release.debug=true in gradle.properties -
    // mirroring the Ant builds' bc-build.properties release.debug flag) labels every module's
    // jars/artifacts <module>-debug-jdk18on-<version> (or <module>-debug-jdk15to18-<version> on a
    // Java <= 8 daemon) and compiles with debug symbols. The default (release.debug=false) is
    // unchanged: <module>-jdk18on-<version> with no debug info.
    ext.releaseDebug = Boolean.parseBoolean(project.findProperty('release.debug')?.toString() ?: 'false')

    JavaVersion current = JavaVersion.current();
    String range;
    if (current.compareTo(JavaVersion.VERSION_1_8) <= 0) {
        range = 'jdk15to18'
    } else {
        range = 'jdk18on'
    }
    ext.vmrange = releaseDebug ? 'debug-' + range : range

}

configure(subprojects.findAll {it.name != 'bom'}) {
    apply plugin: 'eclipse'
    apply plugin: 'maven-publish'


    JavaVersion current = JavaVersion.current();
    int releaseVersion = 8;
    if (current.compareTo(JavaVersion.VERSION_1_8) <= 0) {
        releaseVersion = 5
    }

    compileJava {
        options.release = releaseVersion;
    }

    compileTestJava {
        options.release = 8;
    }


    task testFull(type: Test) {
        systemProperties = [
                'test.full'        : 'true'
        ]
        maxHeapSize = "1536m"

        finalizedBy jacocoTestReport

        filter {
            includeTestsMatching "AllTest*"
        }
    }

    test {
        forkEvery = 1;
        maxParallelForks = 1;
        maxHeapSize = "1536m"
        testLogging.showStandardStreams = false

        jvmArgs = ['-Dtest.java.version.prefix=any']

        finalizedBy jacocoTestReport

        filter {
            includeTestsMatching "AllTest*"
            // the pattern also matches the nested TestCase classes some suites declare
            // (AllTestsSlow$RegressionTestTest etc.), which would then run standalone as
            // well as through their suite() - only run them through the suite.
            excludeTestsMatching "*\$*"
            if (project.hasProperty('excludeTests')) {
                excludeTestsMatching "${excludeTests}"
            }
        }
    }



    dependencies {
        checkstyle files("$rootDir/config/checkstyle/lib/methodchecker-1.0.0.jar")
        checkstyle 'com.puppycrawl.tools:checkstyle:9.0'
        errorprone "com.google.errorprone:error_prone_core:2.43.0"
    }

    checkstyle {
        configFile = file("$rootDir/config/checkstyle/checkstyle.xml");
        toolVersion = '9.0'; // your choice here
        sourceSets = [project.sourceSets.main]
    }

    nohttp {
        source.exclude 'junit*'
        source.exclude '*/*.asc'
        source.exclude '*/*.bpg'
        source.exclude '*/*.class'
        source.exclude '*/*.crl'
        source.exclude '*/*.eml'
        source.exclude '*/*.gen'
        source.exclude '*/*.gpg'
        source.exclude '*/*.jar'
        source.exclude '*/*.message'
        source.exclude '*/*.pub'
        source.exclude '*/*.rsp'
        source.exclude '.*'
        source.exclude 'out'
        source.exclude 'build'
        source.exclude '**/build'
        source.exclude '**/src/test'
        source.exclude '**/*.cnf'
        source.exclude '**/*.crt'
        source.exclude '**/*.iml'
        source.exclude '**/*.key'
        source.exclude '**/*.txt'
        source.exclude '**/*.pem'
        source.exclude '**/legacy'
    }

    jacocoTestReport {
        dependsOn test // tests are required to run before generating the report
    }

    jacoco {
        reportsDirectory = layout.buildDirectory.dir("jacoco")
    }

    tasks.withType(JavaCompile).configureEach {
        options.debug = releaseDebug;
    }

    tasks.withType(Test).configureEach {
        reports {
            junitXml.outputLocation = layout.buildDirectory.dir("test-results")
        }

        // The PKCS#12 keystore writes with a 600,000 iteration PBE by default, and BCFKS
        // with a 51,200 iteration PBKDF2-HMAC-SHA512, which is several seconds per store and
        // dominates the wall time of any suite that touches a keystore. The tests are not
        // measuring the KDF, so write cheap files here. Runs after testFull's
        // systemProperties assignment above, so it survives it.
        systemProperty 'org.bouncycastle.pkcs12.store_it_count', '4096'
        systemProperty 'org.bouncycastle.bcfks.store_it_count', '1024'
    }

    // Bundle the project LICENSE into META-INF/ of every jar produced.
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE.md')) {
            into 'META-INF'
        }
    }

}


test.dependsOn([':core:test', ':prov:test', ':prov:test11', ':prov:test15', ':prov:test17', ':pkix:test', 'pg:test', ':pgsc:test', ':tls:test', ':tls-klog:test', 'mls:test', 'mail:test', 'jmail:test'])

// Aggregate all published jars (main, sources, javadoc) into a top-level dist/
// directory so consumers have a single place to pick up the build outputs.
// bctls-klog is a drop-in replacement for bctls rather than an addition to it (same module name,
// same packages), so it ships alongside the others here but is deliberately absent from the BOM:
// resolving both onto one class path would be a duplicate-class mess, and the choice between them
// is one a consumer has to make deliberately. See tls-klog/build.gradle.
def distModules = ['core', 'util', 'prov', 'pkix', 'pg', 'tls', 'tls-klog', 'mls', 'mail', 'jmail']

distModules.each { evaluationDependsOn(":$it") }

task copyJars(type: Copy) {
    description = 'Bundles produced jars (main, sources, javadoc) into the top-level dist/ directory.'
    group = 'distribution'

    distModules.each { name ->
        def sp = project(":$name")
        from(sp.tasks.named('jar'))
        from(sp.tasks.named('sourcesJar'))
        from(sp.tasks.named('javadocJar'))
    }

    into layout.projectDirectory.dir('dist')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    doFirst {
        delete fileTree(destinationDir).matching { include '*.jar' }
    }

    doLast {
        logger.lifecycle("Copied ${didWork ? source.files.size() : 0} jar(s) to ${destinationDir}")
    }
}

// As copyJars but omits bccore, whose classes are already bundled into the
// published bcprov jar via the core-into-prov srcDirs trick. Matches the set
// of artifacts published to Maven Central.
task copyMavenJars(type: Copy) {
    description = 'Bundles the Maven publication set of jars (everything except bccore) into the top-level dist/ directory.'
    group = 'distribution'

    (distModules - 'core').each { name ->
        def sp = project(":$name")
        from(sp.tasks.named('jar'))
        from(sp.tasks.named('sourcesJar'))
        from(sp.tasks.named('javadocJar'))
    }

    into layout.projectDirectory.dir('dist')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    doFirst {
        delete fileTree(destinationDir).matching { include '*.jar' }
    }

    doLast {
        logger.lifecycle("Copied ${didWork ? source.files.size() : 0} jar(s) to ${destinationDir}")
    }
}

