plugins {
  id "biz.aQute.bnd.builder" version "7.1.0"
}

// bctls-klog is the RFC 9850 (SSLKEYLOGFILE) key-logging build of the TLS API: bctls with the
// org.bouncycastle.tls.KeyLog no-op replaced by one that reports connection secrets to a
// TlsKeyLog named in the JVM's java.security file. It is a separate artifact rather than a
// property on the standard jar because RFC 9850 1.1 asks that a deployed binary not be able to
// disclose its own keys at all; swapping the jar is the act that grants it that ability.
//
// Built the way bcjmail is built from bcmail: copy ../tls/src over our own src (Copy processes
// each 'from' in turn and, under DuplicatesStrategy.INCLUDE, the last writer of a path wins), then
// compile the merged tree out of build/src. So this module holds only what differs from tls, and
// everything else tracks tls automatically.

jar.archiveBaseName = "bctls-klog-$vmrange"

sourceSets {
    main {
         java {
            srcDirs = ['build/src/main/java', 'build/src/main/jdk1.5']
         }
    }

    java9 {
        java {
            srcDirs = ['build/src/main/jdk1.9']
        }
    }

    java17 {
        java {
            srcDirs = ['build/src/main/jdk17']
        }
    }

    java25 {
        java {
            srcDirs = ['build/src/main/jdk25']
        }
    }

    test {
        java {
            srcDirs = ['build/src/test/java']
        }
    }
}

dependencies {

    implementation project(':prov')
    implementation project(':util')
    implementation project(':pkix')

    java9Implementation project(':prov')
    java9Implementation project(':util')
    java9Implementation project(':pkix')
    java9Implementation files(sourceSets.main.output.classesDirs) {
        builtBy compileJava
    }

    java17Implementation project(':prov')
    java17Implementation project(':util')
    java17Implementation project(':pkix')
    java17Implementation files([
    		sourceSets.main.output.classesDirs,
    		sourceSets.java9.output]) {
        builtBy compileJava9Java
    }

    java25Implementation project(':prov')
    java25Implementation project(':util')
    java25Implementation project(':pkix')
    java25Implementation files([
    		sourceSets.main.output.classesDirs,
            sourceSets.java9.output.classesDirs,
            sourceSets.java17.output.classesDirs]) {
        builtBy compileJava17Java
    }
}

evaluationDependsOn(":prov")
evaluationDependsOn(":util")
evaluationDependsOn(":pkix")

task copyTask(type: Copy) {
    duplicatesStrategy = 'include'
    from '../tls/src/main'
    from 'src/main'
    into 'build/src/main'
}

task copyTestTask(type: Copy) {
    duplicatesStrategy = 'include'
    from '../tls/src/test'
    from 'src/test'
    into 'build/src/test'
}

compileJava.dependsOn(copyTask)
processResources.dependsOn(copyTask)
compileJava9Java.dependsOn(copyTask)
compileJava17Java.dependsOn(copyTask)
compileJava25Java.dependsOn(copyTask)
compileTestJava.dependsOn(copyTestTask)

compileJava {
    options.release = 8
}

compileJava9Java {

    options.release = 9

    def prov_jar="${project(":prov").jar.outputs.files.getFiles().getAt(0)}"
    def util_jar="${project(":util").jar.outputs.files.getFiles().getAt(0)}"
    def pkix_jar="${project(":pkix").jar.outputs.files.getFiles().getAt(0)}"

    options.compilerArgs += [
            '--module-path', "${prov_jar}${File.pathSeparator}${util_jar}${File.pathSeparator}${pkix_jar}"
    ]

    options.sourcepath = files(['build/src/main/java', 'build/src/main/jdk1.9'])
}

compileJava17Java {

    targetCompatibility = 17
    sourceCompatibility = 17

    def prov_jar="${project(":prov").jar.outputs.files.getFiles().getAt(0)}"
    def util_jar="${project(":util").jar.outputs.files.getFiles().getAt(0)}"
    def pkix_jar="${project(":pkix").jar.outputs.files.getFiles().getAt(0)}"

    options.compilerArgs += [
        '--module-path', "${prov_jar}${File.pathSeparator}${util_jar}${File.pathSeparator}${pkix_jar}"
    ]

    options.sourcepath = files(['build/src/main/java', 'build/src/main/jdk17'])
}

compileJava25Java {

    options.release = 25

    def prov_jar="${project(":prov").jar.outputs.files.getFiles().getAt(0)}"
    def util_jar="${project(":util").jar.outputs.files.getFiles().getAt(0)}"
    def pkix_jar="${project(":pkix").jar.outputs.files.getFiles().getAt(0)}"

    options.compilerArgs += [
            '--module-path', "${prov_jar}${File.pathSeparator}${util_jar}${File.pathSeparator}${pkix_jar}"
    ]

    options.sourcepath = files(['build/src/main/java', 'build/src/main/jdk25'])
}

compileJava9Java.dependsOn([":prov:jar", ":util:jar",":pkix:jar"])
compileJava17Java.dependsOn([":prov:jar", ":util:jar",":pkix:jar"])
compileJava25Java.dependsOn([":prov:jar", ":util:jar",":pkix:jar"])

// The copied tls tests are here for their mock clients, servers and credential loading, not to be
// run again: they exercise code this build shares with tls unchanged, and :tls:test already covers
// it. Replacing the include patterns (the root build sets "AllTest*" for every module) leaves just
// the key-log suite, which is the only thing this module actually adds.
// KeyLog resolves its sink once per JVM, so the rejection test needs one where that has not
// happened yet. forkEvery = 1 (set for every module by the root build) gives each of these two
// classes its own JVM, which is why the rejection test is listed separately rather than folded
// into the suite above.
test {
    filter {
        setIncludePatterns(
            "org.bouncycastle.tls.keylog.test.AllTests",
            "org.bouncycastle.tls.KeyLogRejectsNonSinkTest")
    }
}

task sourcesJar(type: Jar) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    exclude("**/*.so")
    into('META-INF/versions/9') {
        from sourceSets.java9.allSource
    }
    into('META-INF/versions/17') {
        from sourceSets.java17.allSource
    }
    into('META-INF/versions/25') {
        from sourceSets.java25.allSource
    }
}

sourcesJar.dependsOn(copyTask)

jar {
    from sourceSets.main.output
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }
    into('META-INF/versions/17') {
        from sourceSets.java17.output
    }
    into('META-INF/versions/25') {
        from sourceSets.java25.output
    }
    String v = "${rootProject.extensions.ext.bundle_version}"
    manifest.attributes('Multi-Release': 'true')
    manifest.attributes('Bundle-Name': 'bctls-klog')
    manifest.attributes('Bundle-SymbolicName': 'bctls-klog')
    manifest.attributes('Bundle-RequiredExecutionEnvironment': 'JavaSE-1.8')
    manifest.attributes('Export-Package': "org.bouncycastle.{jsse|tls}.*;version=${v}")
    manifest.attributes('Import-Package': "java.*;resolution:=optional,javax.*;resolution:=optional,!org.bouncycastle.{jsse|tls}.*,org.bouncycastle.*;version=\"[${v},${maxVersion})\"")
    manifest.attributes('Bundle-Version': "${v}")
    manifest.attributes('Permissions': 'all-permissions')
    manifest.attributes('Codebase': '*')
    manifest.attributes('Application-Library-Allowable-Codebase': '*')
    manifest.attributes('Caller-Allowable-Codebase': '*')
    manifest.attributes('Trusted-Library': 'true')
}

task javadocJar(type: Jar, dependsOn: javadoc) {
  archiveBaseName = jar.archiveBaseName
  archiveClassifier = 'javadoc'
  from javadoc.destinationDir
}

artifacts {
    archives jar
    archives javadocJar
    archives sourcesJar
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.bouncycastle'
            artifactId = "bctls-klog-$vmrange"
            from components.java

            artifact(javadocJar)
            artifact(sourcesJar)
        }

    }
}
