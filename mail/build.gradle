plugins {
  id "biz.aQute.bnd.builder" version "7.4.0"
}

jar.archiveBaseName = "bcmail-$vmrange"

sourceSets {
    java9 {
        java {
            srcDirs = ['src/main/jdk1.9']
        }
    }
}

configurations {
    mailModulePath
}

dependencies {
    implementation project(':prov')
    implementation project(':util')
    implementation project(':pkix')

    implementation group: 'javax.mail', name: 'mail', version: '1.4.7'
    // javax.mail:mail:1.4 pulls in javax.activation:activation:1.1 transitively - both are
    // needed as automatic modules ("mail", "activation") on the module-info.java compile path,
    // since neither javax.mail nor javax.activation is a JDK-bundled module on Java 11+.
    mailModulePath group: 'javax.mail', name: 'mail', version: '1.4.7'

    java9Implementation files(sourceSets.main.output.classesDirs) {
        builtBy compileJava
    }
}

// module-info.java declares its javax.mail/javax.activation dependences under all four names
// those libraries are known by (see the comment there), so all four have to be observable when
// it is compiled. Only one generation can be supplied for real: mail-1.4.jar ("mail") and
// javax.mail-1.6.2.jar ("java.mail") both contain the javax.mail package, and two automatic
// modules exporting the same package to us is a resolution error. So the 1.4.x pair is the real
// one - matching what the main sources compile against - and the "java.*" names are supplied as
// empty stub modules, named only by their file names. They carry no classes, exist purely so the
// optional requires resolve at compile time, and are neither needed nor shipped at run time.
task moduleNameStubJars {
    ext.stubDir = layout.buildDirectory.dir("module-name-stubs").get().asFile
}

['java.mail', 'java.activation'].each { stubName ->
    def stubTask = tasks.register("stubJar_${stubName.replace('.', '_')}", Jar) {
        archiveFileName = "${stubName}.jar"
        destinationDirectory = moduleNameStubJars.stubDir
    }
    moduleNameStubJars.dependsOn stubTask
}

evaluationDependsOn(":prov")
evaluationDependsOn(":util")
evaluationDependsOn(":pkix")

compileJava {

    options.release = 8
}


compileJava9Java {
    dependsOn moduleNameStubJars

    // Deliberately source/targetCompatibility rather than options.release = 9: under --release 9
    // java.activation is a real (since-removed) platform module exporting javax.activation, which
    // collides with the activation automatic module the same descriptor requires. Compiling against
    // the current platform leaves the name to the stub jar. Safe here because this source set is
    // module-info.java alone - no platform API is compiled against.
    sourceCompatibility = 9
    targetCompatibility = 9
    def prov_jar="${project(":prov").jar.outputs.files.getFiles().getAt(0)}"
    def util_jar="${project(":util").jar.outputs.files.getFiles().getAt(0)}"
    def pkix_jar="${project(":pkix").jar.outputs.files.getFiles().getAt(0)}"

    options.compilerArgs += [
            '--module-path', "${prov_jar}${File.pathSeparator}${util_jar}${File.pathSeparator}${pkix_jar}${File.pathSeparator}${configurations.mailModulePath.asPath}${File.pathSeparator}${moduleNameStubJars.stubDir}"
    ]

    options.sourcepath = files(['src/main/java', 'src/main/jdk1.9'])
}


jar {
    from sourceSets.main.output
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }
    String v = "${rootProject.extensions.ext.bundle_version}"
    manifest.attributes('Multi-Release': 'true')
    manifest.attributes('Bundle-Name': 'bcmail')
    manifest.attributes('Bundle-SymbolicName': 'bcmail')
    manifest.attributes('Bundle-RequiredExecutionEnvironment': 'JavaSE-1.8')
    manifest.attributes('Export-Package': "org.bouncycastle.mail.*;version=${v}")
    manifest.attributes('Import-Package': "java.*;resolution:=optional,javax.*;resolution:=optional,!org.bouncycastle.mail.*,org.bouncycastle.*;version=\"[${v},${maxVersion})\"")
    manifest.attributes('Bundle-Version': "${v}")
    manifest.attributes('Permissions': 'all-permissions')
    manifest.attributes('Codebase': '*')
    manifest.attributes('Application-Library-Allowable-Codebase': '*')
    manifest.attributes('Caller-Allowable-Codebase': '*') 
    manifest.attributes('Trusted-Library': 'true')
}

task sourcesJar(type: Jar) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    into('META-INF/versions/9') {
        from sourceSets.java9.allSource
    }
}


task javadocJar(type: Jar, dependsOn: javadoc) {
  archiveBaseName = jar.archiveBaseName
  archiveClassifier = 'javadoc'
  from javadoc.destinationDir
}

artifacts {
    archives jar
    archives javadocJar
    archives sourcesJar
}

test {
    forkEvery = 1;
    maxParallelForks = 8;
    jvmArgs = ['-Dtest.java.version.prefix=any']
}

compileJava9Java.dependsOn([":prov:jar", ":util:jar",":pkix:jar"])

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.bouncycastle'
            artifactId = "bcmail-$vmrange"
            from components.java


            artifact(javadocJar)
            artifact(sourcesJar)
        }


    }
}
