plugins {
    id("java-platform")
    id("maven-publish")
}


// 1.86.1 and 1.86.2 are point releases of bctls alone (github #2448, #2493): only the tls
// constraint follows the project version, the other seven modules stay pinned at the 1.86
// artifacts already published, as the 1.85.2 BOM did for its lone bcprov republish.
dependencies {
    constraints {
        api("org.bouncycastle:bcprov-$vmrange:1.86")
        api("org.bouncycastle:bcutil-$vmrange:1.86")
        api("org.bouncycastle:bcpkix-$vmrange:1.86")
        api("org.bouncycastle:bcpg-$vmrange:1.86")
        api(project(":tls"))
        api("org.bouncycastle:bcmls-$vmrange:1.86")
        api("org.bouncycastle:bcmail-$vmrange:1.86")
        api("org.bouncycastle:bcjmail-$vmrange:1.86")
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'org.bouncycastle'
            artifactId = "bc-$vmrange-bom"
            from components.javaPlatform
            pom {
                name = "Bouncy Castle Java 8+ ${version} (Bill of Materials)"
                description = "This Bill of Materials POM can be used to ease dependency management when referencing multiple Bouncy Castle artifacts using Gradle or Maven."
                url = 'https://www.bouncycastle.org/download/bouncy-castle-java/'
                licenses {
                    license {
                        name = 'Bouncy Castle Licence'
                        url = 'https://www.bouncycastle.org/licence.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/bcgit/bc-java'
                }
                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/bcgit/bc-java/issues'
                }
                developers {
                    developer {
                        id = 'feedback-crypto'
                        name = 'The Legion of the Bouncy Castle Inc.'
                        email = 'feedback-crypto@bouncycastle.org'
                    }
                }
            }
        }
    }
}
